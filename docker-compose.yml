version: '3.8'

services:
  pov-postgres:
    image: postgres:16-alpine
    container_name: pov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pov_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"   # Внешний порт 5433 -> внутренний 5432
    volumes:
      - pov_postgres_data:/var/lib/postgresql/data

volumes:
  pov_postgres_data: