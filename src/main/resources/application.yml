server:
  port: 8088          # Сервер теперь работает на 8088

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pov_db   # Подключаемся к докеру на порт 5433
    username: postgres
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

jwt:
  # Длинный секретный ключ для подписи токенов
  secret: yourSuperSecretKeyForPovMatrixRotorDisplayMustBeVeryLong32Chars!